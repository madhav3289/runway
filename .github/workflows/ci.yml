# Place at the REPO ROOT: .github/workflows/ci.yml  (GitHub only reads workflows from the root)
name: CI

on: [push, pull_request]

jobs:
  sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runway-backend/sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runway-backend/sim/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  api:
    runs-on: ubuntu-latest
    # GitHub starts a throwaway Postgres for the tests; nothing to install or configure yourself
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/runway_test
    defaults:
      run:
        working-directory: runway-backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: runway-backend/api/package-lock.json
      - run: npm ci
      - run: node scripts/setupDb.js
      - run: npm test